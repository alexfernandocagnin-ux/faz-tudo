# Tema do app web (web/app.py). Claro e escuro definidos separadamente. O padrão é o Claro (o app grava na 1ª visita);
# quem quiser troca no seletor "Tema" da barra lateral. As cores foram escolhidas para texto legível nos dois.

[server]
maxUploadSize = 200

[browser]
gatherUsageStats = false

[client]
# Esconde o menu de desenvolvedor (Deploy, rerun, etc.) para quem usa o site.
toolbarMode = "minimal"

[theme]
baseRadius = "0.6rem"
showSidebarBorder = true

[theme.light]
primaryColor = "#0d9488"
backgroundColor = "#f6f8fb"
secondaryBackgroundColor = "#eef2f7"
textColor = "#0f172a"
linkColor = "#0f766e"
borderColor = "#d9dfe8"

[theme.dark]
primaryColor = "#0d9488"
backgroundColor = "#0b1220"
secondaryBackgroundColor = "#131c2e"
textColor = "#e6e9ef"
linkColor = "#5eead4"
borderColor = "#27324a"

[theme.light.sidebar]
backgroundColor = "#ffffff"

[theme.dark.sidebar]
backgroundColor = "#0f1729"
